{% extends "base.html" %}

{% block content %}
<div class="relative bg-white dark:bg-gray-900 overflow-hidden transition-colors">
    <div class="max-w-7xl mx-auto">
        <div class="relative z-10 pb-8 bg-white dark:bg-gray-900 sm:pb-16 md:pb-20 lg:max-w-2xl lg:w-full lg:pb-28 xl:pb-32 pt-16 lg:pt-24">
            <main class="mt-10 mx-auto max-w-7xl px-4 sm:mt-12 sm:px-6 md:mt-16 lg:mt-20 lg:px-8 xl:mt-28">
                <div class="sm:text-center lg:text-left">
                    <p class="inline-flex items-center rounded-full bg-brand-50 dark:bg-brand-900/30 px-3 py-1 text-sm font-medium text-brand-700 dark:text-brand-300 ring-1 ring-inset ring-brand-600/20 dark:ring-brand-500/30 mb-4">
                        AI-powered career coaching
                    </p>
                    <h1 class="text-4xl tracking-tight font-extrabold text-gray-900 dark:text-white sm:text-5xl md:text-6xl">
                        <span class="block xl:inline">Accelerate your career</span>
                        <span class="block text-brand-600 dark:text-brand-400 xl:inline">with AI coaching</span>
                    </h1>
                    <p class="mt-3 text-base text-gray-500 dark:text-gray-400 sm:mt-5 sm:text-lg sm:max-w-xl sm:mx-auto md:mt-5 md:text-xl lg:mx-0">
                        Get personalized career guidance, resume analysis, and interview preparation powered by advanced AI. Discover your true potential today.
                    </p>
                    <div class="mt-5 sm:mt-8 sm:flex sm:justify-center lg:justify-start">
                        <div class="rounded-md shadow dark:shadow-brand-900/20">
                            <a href="/signup" class="w-full flex items-center justify-center px-8 py-3 border border-transparent text-base font-medium rounded-md text-white bg-brand-600 hover:bg-brand-700 dark:bg-brand-500 dark:hover:bg-brand-600 md:py-4 md:text-lg md:px-10 transition-colors">
                                Get started
                            </a>
                        </div>
                        <div class="mt-3 sm:mt-0 sm:ml-3">
                            <a href="/features" class="w-full flex items-center justify-center px-8 py-3 border border-transparent text-base font-medium rounded-md text-brand-700 dark:text-brand-300 bg-brand-100 dark:bg-brand-900/40 hover:bg-brand-200 dark:hover:bg-brand-900/60 md:py-4 md:text-lg md:px-10 transition-colors ring-1 ring-brand-600/10 dark:ring-brand-500/20">
                                View features
                            </a>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <div class="lg:absolute lg:inset-y-0 lg:right-0 lg:w-1/2">
        <div class="hero-logo-panel h-56 w-full sm:h-72 md:h-96 lg:w-full lg:h-full bg-gradient-to-br from-brand-100 to-brand-50 dark:from-gray-800 dark:to-gray-900 dark:via-brand-950 flex items-center justify-center relative overflow-hidden">
            <div class="absolute inset-0 dark:opacity-40" aria-hidden="true">
                <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-brand-400/20 dark:bg-brand-500/10 rounded-full blur-3xl"></div>
                <div class="absolute bottom-1/4 right-1/4 w-48 h-48 bg-brand-300/30 dark:bg-brand-600/10 rounded-full blur-2xl"></div>
            </div>
            <svg class="hero-logo relative h-56 w-56 sm:h-64 sm:w-64 drop-shadow-lg dark:drop-shadow-brand-900/50" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="AI logo">
                <circle class="logo-glow-outer" cx="120" cy="120" r="108" fill="#dcfce7" opacity="0.55"/>
                <circle class="logo-glow-inner" cx="120" cy="120" r="88" fill="#bbf7d0" opacity="0.35"/>
                <rect x="52" y="52" width="136" height="136" rx="36" fill="url(#aiLogoGradient)"/>
                <rect x="52" y="52" width="136" height="136" rx="36" stroke="#15803d" stroke-width="2" opacity="0.15" class="logo-border"/>
                <circle cx="120" cy="88" r="7" fill="white" opacity="0.95"/>
                <circle class="logo-node" cx="88" cy="128" r="5.5" fill="#dcfce7"/>
                <circle class="logo-node" cx="152" cy="128" r="5.5" fill="#dcfce7"/>
                <circle class="logo-node" cx="120" cy="152" r="4.5" fill="#dcfce7"/>
                <line x1="120" y1="95" x2="92" y2="123" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
                <line x1="120" y1="95" x2="148" y2="123" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
                <line x1="120" y1="95" x2="120" y2="147" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
                <text x="120" y="138" text-anchor="middle" fill="white" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">AI</text>
                <path d="M178 48 L181 58 L191 61 L181 64 L178 74 L175 64 L165 61 L175 58 Z" fill="#4ade80" class="logo-sparkle"/>
                <path d="M58 168 L60 174 L66 176 L60 178 L58 184 L56 178 L50 176 L56 174 Z" fill="#86efac" opacity="0.8" class="logo-sparkle"/>
                <defs>
                    <linearGradient id="aiLogoGradient" x1="52" y1="52" x2="188" y2="188" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#22c55e"/>
                        <stop offset="1" stop-color="#16a34a"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>
    </div>
</div>
{% endblock %}
