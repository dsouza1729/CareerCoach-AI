{% extends "base.html" %}
{% block title %}Forgot Password - CareerCoach{% endblock %}
{% block content %}
<div class="min-h-full flex items-center justify-center py-12 px-4 mt-10">
    <div class="max-w-md w-full bg-white dark:bg-gray-800 p-10 rounded-xl shadow-lg border border-gray-100 dark:border-gray-700">
        <h2 class="text-2xl font-bold text-center text-gray-900 dark:text-white">Reset your password</h2>
        <p class="mt-2 text-center text-sm text-gray-500 dark:text-gray-400">Enter your email and we'll create a reset link.</p>
        <form id="forgotForm" class="mt-8 space-y-4">
            <input type="email" id="email" required placeholder="Email address" class="w-full px-3 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-900 rounded-md">
            <button type="submit" class="w-full py-3 bg-brand-600 text-white rounded-md font-medium hover:bg-brand-700">Send reset link</button>
        </form>
        <p id="message" class="hidden mt-4 text-sm text-center text-green-600"></p>
        <p id="debugLink" class="hidden mt-2 text-xs text-center text-brand-600 break-all"></p>
        <p class="mt-4 text-center text-sm"><a href="/login" class="text-brand-600 hover:underline">Back to login</a></p>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await fetch('/forgot-password', {
        method: 'POST',
        headers: csrfHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ email: document.getElementById('email').value })
    });
    const data = await res.json();
    const msg = document.getElementById('message');
    msg.textContent = data.message || 'Check your email for a reset link.';
    msg.classList.remove('hidden');
    if (data.debug_reset_url) {
        const link = document.getElementById('debugLink');
        link.innerHTML = `<a href="${data.debug_reset_url}" class="hover:underline">Dev reset link</a>`;
        link.classList.remove('hidden');
    }
});
</script>
{% endblock %}
