{% extends "base.html" %}
{% block title %}Reset Password - CareerCoach{% endblock %}
{% block content %}
<div class="min-h-full flex items-center justify-center py-12 px-4 mt-10">
    <div class="max-w-md w-full bg-white dark:bg-gray-800 p-10 rounded-xl shadow-lg border border-gray-100 dark:border-gray-700">
        {% if error %}
        <h2 class="text-2xl font-bold text-center text-red-600">{{ error }}</h2>
        <p class="mt-4 text-center"><a href="/forgot-password" class="text-brand-600">Request a new link</a></p>
        {% else %}
        <h2 class="text-2xl font-bold text-center text-gray-900 dark:text-white">Set a new password</h2>
        <form id="resetForm" class="mt-8 space-y-4">
            <input type="password" id="password" required minlength="8" placeholder="New password (8+ chars)" class="w-full px-3 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-900 rounded-md">
            <button type="submit" class="w-full py-3 bg-brand-600 text-white rounded-md font-medium hover:bg-brand-700">Update password</button>
        </form>
        <p id="errorMessage" class="hidden mt-4 text-sm text-center text-red-500"></p>
        {% endif %}
    </div>
</div>
{% endblock %}
{% block scripts %}
{% if token %}
<script>
document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await fetch('/reset-password/{{ token }}', {
        method: 'POST',
        headers: csrfHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ password: document.getElementById('password').value })
    });
    if (res.ok) window.location.href = '/login';
    else {
        const data = await res.json();
        const err = document.getElementById('errorMessage');
        err.textContent = data.detail || 'Reset failed';
        err.classList.remove('hidden');
    }
});
</script>
{% endif %}
{% endblock %}
